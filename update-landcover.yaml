
name: GBoS GEOAI - Automated Land Cover Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 5 * *"

permissions:
  contents: write

jobs:
  update-landcover:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Earth Engine processing
        env:
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          GEE_EA_ASSET: ${{ vars.GEE_EA_ASSET }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}

        run: |
          python scripts/run_pipeline.py

      - name: Commit generated outputs
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data tiles

          if git diff --cached --quiet; then
            echo "No output changes."
          else
            git commit -m "Automated GBoS land-cover update"
            git push
          fi
