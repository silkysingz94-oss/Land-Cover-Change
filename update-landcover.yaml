
name: Update Land Cover Intelligence

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 5 * *"

  push:
    branches:
      - main
    paths:
      - "scripts/run_pipeline.py"
      - "requirements.txt"
      - ".github/workflows/update-landcover.yml"

permissions:
  contents: write

concurrency:
  group: landcover-update
  cancel-in-progress: false

jobs:
  update-landcover:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        env:
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          GEE_EA_ASSET: ${{ vars.GEE_EA_ASSET }}
        run: |
          test -n "$EE_PROJECT_ID" || (echo "Missing EE_PROJECT_ID secret" && exit 1)
          test -n "$EE_SERVICE_ACCOUNT_JSON" || (echo "Missing EE_SERVICE_ACCOUNT_JSON secret" && exit 1)
          test -n "$GCS_BUCKET" || (echo "Missing GCS_BUCKET variable" && exit 1)
          test -n "$GEE_EA_ASSET" || (echo "Missing GEE_EA_ASSET variable" && exit 1)

      - name: Run Earth Engine processing
        env:
          EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
          EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          GEE_EA_ASSET: ${{ vars.GEE_EA_ASSET }}
        run: |
          python scripts/run_pipeline.py

      - name: Commit updated dashboard data and tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data tiles

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Update land cover satellite intelligence"
            git push
          fi
